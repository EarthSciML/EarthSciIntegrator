name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    name: Schemas and fixtures (conformance tier 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - run: python tests/conformance/validate_schemas.py
      - name: M1 cases are up to date with their generator
        run: |
          python tests/conformance/m1/make_cases.py
          git diff --exit-code tests/conformance/m1/cases.json

  julia:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The tests validate the result files they write against
      # spec/schemas/result.schema.json with Python's jsonschema.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - name: Test
        # Test-only dependencies (OrdinaryDiffEq, SciMLSensitivity, Zygote,
        # ForwardDiff) live in julia/EarthSciIntegrator.jl/test/Project.toml.
        run: julia --project=julia/EarthSciIntegrator.jl -e 'using Pkg; Pkg.test()'
      - name: Upload conformance result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-m1-results-${{ matrix.version }}
          path: julia/EarthSciIntegrator.jl/test/results/
          if-no-files-found: ignore

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
        env:
          EARTHSCI_RESULTS_DIR: ${{ github.workspace }}/rust-results
      - name: Upload conformance result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-m1-results
          path: rust-results/
          if-no-files-found: ignore

  cross-language:
    name: Julia ${{ matrix.version }} against Rust (conformance tier 3)
    needs: [julia, rust]
    # Runs when either suite failed too: a failing case still writes its result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        # A suite that wrote no result files uploaded none; the comparison
        # below then names the missing directory.
        continue-on-error: true
        with:
          name: julia-m1-results-${{ matrix.version }}
          path: julia-results
      - uses: actions/download-artifact@v4
        # A suite that wrote no result files uploaded none; the comparison
        # below then names the missing directory.
        continue-on-error: true
        with:
          name: rust-m1-results
          path: rust-results
      # A case only one implementation runs yet (a method family landing in
      # one language before the other) is listed but does not fail the job.
      - run: python tests/conformance/m1/compare_results.py julia-results rust-results

# Runnable examples for the generated API reference (see tools/api_docs/README.md
# in EarthSciML/earthsci.dev). Built against the in-repo crate, never a
# published release.
[package]
name = "earthsci-integrator-api-examples"
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, so cargo never looks for one further up the tree.
[workspace]

[dependencies]
earthsci-integrator = { path = "../../../../rust/earthsci-integrator" }
serde_json = "1"

# As rust/Cargo.toml: EarthSciAST and EarthSciASTDiff main until their next
# releases. Remove before merging.
[patch.crates-io]
earthsci-ast = { git = "https://github.com/EarthSciML/EarthSciAST", branch = "main" }
earthsci-astdiff = { git = "https://github.com/EarthSciML/EarthSciASTDiff", branch = "main" }

[profile.dev]
debug = false

[[example]]
name = "forward_and_gradient"
path = "forward_and_gradient.rs"

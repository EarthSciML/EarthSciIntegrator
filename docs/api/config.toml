# API reference configuration, read by the shared tooling in
# EarthSciML/earthsci.dev (tools/api_docs; schema in its README.md).

[reference]
title = "EarthSciIntegrator"
summary = "implement the one EarthSciIntegrator spec (`spec/`) natively, checked against each other by a shared conformance suite."

[bindings.julia]
path = "julia/EarthSciIntegrator.jl"
package = "EarthSciIntegrator"
env = "docs/api/examples/julia"
# `odefunction`'s method lives in a package extension (SciMLBase). The planner's
# EarthSciAST extension is not loaded: its docstring-bearing generic `plan` is in
# the main module.
load = ["SciMLBase"]

[bindings.rust]
# The core crate of the rust/ workspace. The planner, solvers and MPI crates
# are separate crates and are not part of this reference yet.
path = "rust/earthsci-integrator"
crate = "earthsci-integrator"

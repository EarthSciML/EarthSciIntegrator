[package]
name = "earthsci-integrator-planner"
description = "EarthSciIntegrator planner: operators, locality, structure, plan emission (spec/plan.md)."
version.workspace = true
edition.workspace = true
# earthsci-ast 0.6 needs Rust 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true

[dependencies]
# The planner does not use the ODE solver, but earthsci-ast 0.6.0 does not
# compile without its `solve` feature (its compiler-agreement adapter module
# is not gated on it), so `solve` stays on; the command-line tool (`cli`) is
# left out.
earthsci-ast = { version = "0.6.0", default-features = false, features = ["solve"] }
# EarthSciASTDiff 0.1.0 (its commit 743d140). Not on crates.io yet, so a git
# dependency; switch to `earthsci-astdiff = "0.1"` from crates.io once it is
# published.
earthsci-astdiff = { git = "https://github.com/EarthSciML/EarthSciASTDiff", rev = "743d1404f7573e91c6789a62f0cad88fd93fc0ad" }
earthsci-integrator-solvers.workspace = true
indexmap = "2"
jsonschema = { version = "0.60", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

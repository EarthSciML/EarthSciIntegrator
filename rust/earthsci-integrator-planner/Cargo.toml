[package]
name = "earthsci-integrator-planner"
description = "EarthSciIntegrator planner: operators, locality, structure, plan emission (spec/plan.md)."
version.workspace = true
edition.workspace = true
# earthsci-ast 0.10 needs Rust 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true

[dependencies]
# The planner does not integrate, but it reads the initial state with
# `initial_state` (spec/plan.md §4), which earthsci-ast 0.10 builds only with
# its `solve` feature, so `solve` stays on; the command-line tool (`cli`) is
# left out.
earthsci-ast = { version = "0.10", default-features = false, features = ["solve"] }
earthsci-astdiff = "0.5"
earthsci-integrator-solvers.workspace = true
indexmap = "2"
ndarray = "0.17"
jsonschema = { version = "0.60", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

[package]
name = "earthsci-integrator-planner"
description = "EarthSciIntegrator planner: operators, locality, structure, plan emission (spec/plan.md)."
version.workspace = true
edition.workspace = true
# earthsci-ast 0.15 needs Rust 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true

[dependencies]
# The planner does not integrate, but it reads the initial state with
# `initial_state` (spec/plan.md §4), which earthsci-ast 0.14 builds only with
# its `solve` feature, so `solve` stays on (the command-line tool is its own
# crate, earthsci-ast-cli, since 0.13.0).
# 0.12.1: the native compiler drives overlap join gates over ring stacks
# (EarthSciAST#721), which reseact's NEI-to-model regrid needs.
# 0.14.0: the native compiler builds an unshaped `ifelse` whose array arm
# reads a calendar-template scalar (EarthSciAST#739), which reseact's NEI
# emissions need; esm 2.3.0 (the pointwise lift on every route, deprecated
# `neg`/`pow`, canonical unit spelling).
# 0.15.0: load, flatten and the native build keep operator references, and
# the merged registry carries their definitions (planner stage C, §4 step 5).
earthsci-ast = { version = "0.15.0", default-features = false, features = ["solve"] }
earthsci-astdiff = "0.6.2"
earthsci-integrator-solvers.workspace = true
indexmap = "2"
ndarray = "0.17"
jsonschema = { version = "0.61", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

# build.rs reads the earthsci-astdiff version from Cargo.lock
# (build/lockfile.rs); the tests read lock files with the same code.
[build-dependencies]
toml = "1"

[dev-dependencies]
toml = "1"

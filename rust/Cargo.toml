[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`; keep it equal to `[workspace.package] version`
# above and bump both together in a release commit.
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.2.0" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.2.0" }

# Unreleased dependencies, pinned by git revision until they are released:
# the Rust EarthSciAST of upstream main after 0.15.0 (operator references
# kept at load and flatten, EarthSciAST#772 and #776) with the lane-program
# fixes EarthSciIntegrator M3 needs: an array faq read at the lane's own cell
# (EarthSciAST#780) and a time per lane (EarthSciAST#781, U19), pinned at the
# head of #781 on the fork; and the EarthSciASTDiff that differentiates
# references without expanding them (EarthSciASTDiff#77). Drop both when the
# releases are out (spec/plan.md §0.2).
[patch.crates-io]
earthsci-ast = { git = "https://github.com/ctessum-claude/EarthSciSerialization.git", rev = "21189c881b567d5833bd6309927c508dffaaa4ed" }
earthsci-astdiff = { git = "https://github.com/ctessum-claude/EarthSciASTDiff.git", rev = "9021c78bb3962da194219a03e72e7d2391ca5da0" }

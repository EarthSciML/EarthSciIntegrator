[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`, and for a 0.0.x version that requirement is
# exact, so bump it with `[workspace.package] version` above (a mismatch fails
# every build, so it cannot go unnoticed).
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.0.1" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.0.1" }

# EarthSciASTDiff's structure-only mode (`jacobian_structure_view`,
# esm-jacobian-spec §2.1), which pass 2 reads (spec/plan.md §5.2.2), is not
# released yet: EarthSciML/EarthSciASTDiff#59. Remove this once a release
# has it, and raise the planner's `earthsci-astdiff` requirement to it.
[patch.crates-io]
earthsci-astdiff = { git = "https://github.com/EarthSciML/EarthSciASTDiff", branch = "feat/structure-only-bands" }

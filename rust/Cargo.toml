[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`; keep it equal to `[workspace.package] version`
# above and bump both together in a release commit.
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.2.0" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.2.0" }

# Unreleased dependencies, pinned by git revision until they are released:
# the Rust EarthSciAST that keeps operator references at load and flatten
# (EarthSciML/EarthSciAST#772, merged into main e0f04e334) with its merged
# registry's bodies in canonical number form (fork branch
# rust-canonical-registry-numbers, to be pinned to upstream main once it
# merges), and the EarthSciASTDiff that differentiates references without
# expanding them (EarthSciML/EarthSciASTDiff#77). Drop both when the
# releases are out (spec/plan.md §0.2).
[patch.crates-io]
earthsci-ast = { git = "https://github.com/ctessum-claude/EarthSciSerialization.git", rev = "3a61fe45496c4d567a9e530d3f853087950c9aac" }
earthsci-astdiff = { git = "https://github.com/ctessum-claude/EarthSciASTDiff.git", rev = "9021c78bb3962da194219a03e72e7d2391ca5da0" }

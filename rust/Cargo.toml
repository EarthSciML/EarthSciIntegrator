[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`, and for a 0.0.x version that requirement is
# exact, so bump it with `[workspace.package] version` above (a mismatch fails
# every build, so it cannot go unnoticed).
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.0.1" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.0.1" }

# Development against EarthSciAST and EarthSciASTDiff main: EarthSciAST#669,
# #670 and #672 and EarthSciASTDiff#64, #65 and #66 are merged but not
# released. Remove this, and raise the `earthsci-ast` and `earthsci-astdiff`
# requirements (and Julia's compat) to the releases that carry them, before
# merging.
[patch.crates-io]
earthsci-ast = { git = "https://github.com/EarthSciML/EarthSciAST", branch = "main" }
earthsci-astdiff = { git = "https://github.com/EarthSciML/EarthSciASTDiff", branch = "main" }

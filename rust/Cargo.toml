[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`; keep it equal to `[workspace.package] version`
# above and bump both together in a release commit.
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.2.0" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.2.0" }

# TEMPORARY: EarthSciASTDiff is pinned to EarthSciML/EarthSciASTDiff#86 (per-cell
# blocks over caller-named cell axes; a column of another rank is never
# diagonal), fork branch cell-axes-blocks, until it merges and is released.
[patch.crates-io]
earthsci-astdiff = { git = "https://github.com/ctessum-claude/EarthSciASTDiff.git", rev = "f9ffc8d6de70c0af5a498afa7f2c6eefa021203a" }

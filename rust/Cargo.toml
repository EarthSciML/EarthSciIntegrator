[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`; keep it equal to `[workspace.package] version`
# above and bump both together in a release commit.
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.2.0" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.2.0" }

# TEMPORARY: EarthSciASTDiff is pinned to the integration branch
# ctessum-claude integ-named-steps-cellblocks: the named-steps stack
# (EarthSciASTDiff #82, #83, #84, #85) merged with #86 (per-cell blocks over
# caller-named cell axes), until they merge and are released.
[patch.crates-io]
earthsci-astdiff = { git = "https://github.com/ctessum-claude/EarthSciASTDiff.git", rev = "627c6f7f077c8ad3c8511356b9557a48fe98718c" }

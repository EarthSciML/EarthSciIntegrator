[workspace]
resolver = "2"
members = [
    "earthsci-integrator",
    "earthsci-integrator-planner",
    "earthsci-integrator-solvers",
    "earthsci-integrator-mpi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciIntegrator"

# Crates inside this workspace that depend on each other. crates.io needs a
# `version` beside every `path`; keep it equal to `[workspace.package] version`
# above and bump both together in a release commit.
[workspace.dependencies]
earthsci-integrator-solvers = { path = "earthsci-integrator-solvers", version = "0.2.0" }
earthsci-integrator-planner = { path = "earthsci-integrator-planner", version = "0.2.0" }

# Unreleased dependencies, pinned by git revision until they are released.
# EarthSciAST: the fork branch m3-gate-lanes-combined (b6b3c36a8). It is
# draft EarthSciAST#801 (m3-gate-lane-and-ic-fixes) on upstream main, which
# carries #781 (a time per lane, U19), #780 (an array faq read at the lane's
# own cell) and #784 (nested reference calls), none of them in a release
# after 0.15.0, with the lane-speed drafts #809 (Julia) and #816 (Rust)
# merged on it. #801 seeds the initial state from a primed provider's record
# and builds lane programs over a makearray region that covers part of a
# lane set (a surface-only coefficient); #809 and #816 make a lane call's
# work proportional to its lanes, not to the domain.
# EarthSciASTDiff: the fork branch named-steps-joins (f8d2f8b4), draft
# EarthSciASTDiff#87 on upstream main: each time-dependent observed's
# derivative in t written once as a named companion observed (reseact's
# chemistry time-derivative document is 1.7 MB instead of 68.8 MB), named
# intermediates on every axis, narrow regions as makearray regions,
# differentiating joins and a chosen parameter set. Drop both pins when the releases are out (spec/plan.md §0.2).
[patch.crates-io]
earthsci-ast = { git = "https://github.com/ctessum-claude/EarthSciSerialization.git", rev = "b6b3c36a8cf737536e98253524c4322e766c91b1" }
earthsci-astdiff = { git = "https://github.com/ctessum-claude/EarthSciASTDiff.git", rev = "f8d2f8b4ee0267c3a6151024b47bc2f0024f8c0c" }
